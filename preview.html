<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Storm">
<title>Ral &amp; Birgi: storm tracker</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#111;color:#e8e8e8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:440px;padding:6px 8px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
h1{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#888;margin:2px 0 0;text-align:center}
button{font:inherit;color:inherit;border:0;border-radius:12px;background:#2a2a2a;touch-action:manipulation;cursor:pointer;transition:transform .06s,filter .06s}
button:active{transform:scale(.94);filter:brightness(1.6)}
.row{display:flex;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* pools */
.pool{border-radius:14px;padding:4px 6px 6px;display:flex;flex-direction:column;align-items:center;border:2px solid}
.pool .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pool .ctl{display:flex;align-items:center;justify-content:space-between;width:100%}
.pool .num{font-size:34px;font-weight:800;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.pool button{width:50px;height:46px;font-size:26px;font-weight:700;background:rgba(255,255,255,.12)}
.p-red{background:#3a1212;border-color:#d63a2f;color:#ff8a80}
.p-blue{background:#10233f;border-color:#2f7fd6;color:#8ec3ff}
.p-white{background:#34312a;border-color:#e8dcc0;color:#f5ecd2}
.p-birgi{background:#3a2a0c;border-color:#e0a21a;color:#ffd166}

/* totals */
.tot{border-radius:14px;background:#1b1b1b;border:2px solid #444;padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tot .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#aaa}
.tot .big{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.storm{border-radius:14px;background:#2a1838;border:2px solid #a45be0;color:#d9b3ff;padding:4px 6px;display:flex;flex-direction:column;align-items:center}
.storm .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.storm .ctl{display:flex;align-items:center;justify-content:space-between;width:100%}
.storm .num{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.storm button{width:46px;height:46px;font-size:26px;font-weight:700;background:rgba(255,255,255,.12)}

/* cast */
.cast button{flex:1;height:64px;font-size:17px;font-weight:800;letter-spacing:.02em}
#bInst{background:linear-gradient(90deg,#1d4f8f,#a8321f);flex:2}
#bSorc{background:#a8321f}
#bOther{background:#444}
.counts{display:flex;gap:6px;font-size:12px;color:#aaa;justify-content:center}
.counts span{background:#1b1b1b;border-radius:8px;padding:3px 8px}
.counts b{color:#fff;font-size:14px}

/* flip */
#flip{border-radius:14px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:22px;text-align:center;background:#1b1b1b;color:#666;border:2px dashed #333;padding:4px}
#flip.win{background:#12441f;color:#7dff9b;border:2px solid #3fd16a}
#flip.lose{background:#4a1111;color:#ff8a80;border:2px solid #ff4a3d}
#flip.fresh{animation:pulse .5s ease-out 3}
#flip small{font-size:11px;font-weight:600;opacity:.75}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
#winBtns{display:none;gap:6px}
#winBtns.show{display:flex}
#winBtns button{flex:1;height:44px;font-weight:700;background:#1f6a35}
#winBtns button.keep{background:#3a3a3a}
.dmg{display:flex;align-items:center;gap:4px;background:#1b1b1b;border-radius:12px;padding:4px 6px;font-size:13px;color:#ccc}
.dmg .lf{min-width:58px;text-align:center;line-height:1}
.dmg .lt{line-height:1;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#999}
.dmg .lt i{font-style:normal;font-size:9px;font-weight:600;letter-spacing:0;text-transform:none;color:#777;margin-left:3px}
.dmg .n{font-size:24px;line-height:1;font-weight:900;color:#ff8a80;font-variant-numeric:tabular-nums}
.dmg button{height:34px;font-weight:700}
.dmg .lb{flex:1;font-size:12px;padding:0 2px;background:#3a2222}
.dmg .pm{width:34px;font-size:20px}
.dmg .flipbtn{padding:0 8px;font-size:12px;background:#33334a}

/* toggles */
.seg{display:flex;background:#1b1b1b;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;font-size:12px;font-weight:700;background:transparent;color:#999;border-radius:9px}
.seg button.on{background:#c9462f;color:#fff}
.tg{flex:1;height:40px;font-size:14px;font-weight:700;background:#2a2a2a;color:#999}
.tg.on{background:#b8860b;color:#fff}
.tg.turn.on{background:#2f7a4a}
.note{font-size:11px;color:#e0a21a;text-align:center;min-height:13px}

/* turn */
.turn-ctl button{flex:1;height:46px;font-size:14px;font-weight:700}
#bPhase{background:#3a3a55}
#bEnd{background:#554030}
#bNew{background:#3a1a1a;color:#ff9a90}
#bUndo{background:#1f4a5a;flex:1.2}

/* log */
details{background:#161616;border-radius:10px;padding:4px 8px}
summary{font-size:12px;color:#888;cursor:pointer}
#log{font-size:12px;color:#aaa;margin:4px 0 0;padding:0;list-style:none;font-family:ui-monospace,Menlo,Consolas,monospace}
#log li{padding:1px 0;border-top:1px solid #222}
</style>
</head>
<body>
<div id="app">
  <h1>Ral &amp; Birgi: storm tracker</h1>

  <div class="grid2">
    <div class="pool p-red"><div class="lbl">Red</div><div class="ctl"><button data-pool="red" data-d="-1">&minus;</button><div class="num" id="n-red">0</div><button data-pool="red" data-d="1">+</button></div></div>
    <div class="pool p-blue"><div class="lbl">Blue</div><div class="ctl"><button data-pool="blue" data-d="-1">&minus;</button><div class="num" id="n-blue">0</div><button data-pool="blue" data-d="1">+</button></div></div>
    <div class="pool p-white"><div class="lbl">White</div><div class="ctl"><button data-pool="white" data-d="-1">&minus;</button><div class="num" id="n-white">0</div><button data-pool="white" data-d="1">+</button></div></div>
    <div class="pool p-birgi"><div class="lbl">Birgi red</div><div class="ctl"><button data-pool="birgi" data-d="-1">&minus;</button><div class="num" id="n-birgi">0</div><button data-pool="birgi" data-d="1">+</button></div></div>
  </div>

  <div class="grid2">
    <div class="tot"><div class="lbl">Total mana</div><div class="big" id="total">0</div></div>
    <div class="storm"><div class="lbl">Storm</div><div class="ctl"><button data-storm="-1">&minus;</button><div class="num" id="n-storm">0</div><button data-storm="1">+</button></div></div>
  </div>

  <div class="row cast">
    <button id="bInst" data-cast="instant">Instant / Sorcery</button>
    <button id="bOther" data-cast="other">Other spell</button>
  </div>
  <div class="counts"><span>Ral spells (instant + sorcery) <b id="c-tot">0</b></span></div>

  <div id="flip">No flips yet</div>
  <div id="winBtns"><button id="bTransform">Transform Ral</button><button id="bKeep" class="keep">Keep him</button></div>
  <div class="dmg"><div class="lf"><div class="lt">Life <i>Ral: <span id="n-dmg">0</span></i></div><div class="n" id="n-life">20</div></div><button class="lb" data-life="-1">&minus;1 fetch</button><button class="lb" data-life="-2">&minus;2 shock</button><button class="pm" data-life="1" aria-label="Life plus one">+</button><button class="pm" data-life="-1" data-manual="1" aria-label="Life minus one">&minus;</button><button class="flipbtn" id="bManual">Flip coin</button></div>

  <div class="seg" id="ralSeg">
    <button data-ral="mage">Ral: Monsoon Mage</button>
    <button data-ral="flipped">Flipped (PW)</button>
    <button data-ral="out">Not in play</button>
  </div>
  <div class="row">
    <button class="tg" id="tBirgi">Birgi out</button>
    <button class="tg turn" id="tTurn">My turn</button>
  </div>
  <div class="note" id="note"></div>

  <div class="row turn-ctl">
    <button id="bPhase">Next phase</button>
    <button id="bEnd">End turn</button>
  </div>
  <div class="row turn-ctl">
    <button id="bUndo">Undo</button>
    <button id="bNew">New game</button>
  </div>

  <details id="logbox" open><summary>Cast log</summary><ul id="log"></ul></details>
</div>

<script id="logic">
// ---- pure logic (no DOM) ----
var POOLS = ['red','blue','white','birgi'];
function freshState(){
  return {red:0,blue:0,white:0,birgi:0,storm:0,inst:0,sorc:0,ralDmg:0,life:20,
    ral:'mage',birgiOut:false,myTurn:true,
    lastFlip:null,pendingWin:false,log:[]};
}
function clone(s){ return JSON.parse(JSON.stringify(s)); }
function addLog(s,txt){ s.log.unshift(txt); if(s.log.length>8) s.log.length=8; }
function ralActive(s){ return s.ral==='mage' && s.myTurn; }
// rand: function returning true for WIN, false for LOSE
function cast(state,type,rand){
  var s = clone(state);
  s.pendingWin = false;
  s.storm += 1;
  var name = 'Other spell';
  if(type==='instant'){ s.inst++; name='Inst/Sorc'; }
  else if(type==='sorcery'){ s.sorc++; name='Sorcery'; }
  if(s.birgiOut) s.birgi++;
  var res = '';
  if((type==='instant'||type==='sorcery') && ralActive(s)){
    var win = rand();
    s.lastFlip = {result: win?'win':'lose', id: Date.now()+Math.random(), manual:false};
    if(win){ s.pendingWin = true; } else { s.ralDmg++; s.life--; }
    res = ', flip '+(win?'WIN':'LOSE')+(win?'':', life '+s.life);
  } else if((type==='instant'||type==='sorcery') && s.ral==='mage' && !s.myTurn){
    res = ', no flip (not my turn)';
  }
  addLog(s, name+': storm '+s.storm+res);
  return s;
}
function manualFlip(state,rand){
  var s = clone(state);
  var win = rand();
  s.lastFlip = {result: win?'win':'lose', id: Date.now()+Math.random(), manual:true};
  s.pendingWin = false;
  addLog(s,'Manual flip: '+(win?'WIN':'LOSE'));
  return s;
}
function adjustPool(state,pool,d){
  var s = clone(state); s[pool] = Math.max(0, s[pool]+d); return s;
}
function adjustStorm(state,d){
  var s = clone(state); s.storm = Math.max(0, s.storm+d); return s;
}
function adjustDmg(state,d){
  var s = clone(state); s.ralDmg = Math.max(0, s.ralDmg+d); return s;
}
function adjustLife(state,d,why){
  var s = clone(state); s.life += d;
  if(why) addLog(s, why+': life '+s.life);
  return s;
}
function setRal(state,v){
  var s = clone(state); s.ral = v; s.pendingWin = false; addLog(s,'Ral: '+v); return s;
}
function transformRal(state){
  var s = clone(state); s.ral='flipped'; s.pendingWin=false; addLog(s,'Ral transformed'); return s;
}
function keepRal(state){
  var s = clone(state); s.pendingWin=false; addLog(s,'Kept Ral'); return s;
}
function toggle(state,key){
  var s = clone(state); s[key] = !s[key]; return s;
}
function nextPhase(state){
  var s = clone(state); s.red=0; s.blue=0; s.white=0; s.pendingWin=false; addLog(s,'Next phase'); return s;
}
function endTurn(state){
  var s = clone(state); s.red=s.blue=s.white=s.birgi=0; s.storm=0; s.inst=0; s.sorc=0; s.pendingWin=false; addLog(s,'End turn'); return s;
}
function newGame(){ var s = freshState(); addLog(s,'New game'); return s; }
function coinWin(){
  var a = new Uint32Array(1);
  var lim = 4294967296 - (4294967296 % 2); // even, so no bias
  do { crypto.getRandomValues(a); } while(a[0] >= lim);
  return (a[0] & 1) === 1;
}
// History handling
function pushHist(hist,state){ hist.push(clone(state)); if(hist.length>50) hist.shift(); }
function undo(hist){ return hist.length ? hist.pop() : null; }
</script>

<script id="ui">
(function(){
  var KEY = 'ralStormTracker.v1';
  var state = freshState(), hist = [];
  try{
    var saved = JSON.parse(localStorage.getItem(KEY)||'null');
    if(saved && saved.state){ state = Object.assign(freshState(), saved.state); if(typeof state.life!=='number') state.life = 20; hist = saved.hist||[]; }
  }catch(e){}

  var $ = function(id){ return document.getElementById(id); };
  var lastShownFlipId = state.lastFlip ? state.lastFlip.id : null;
  var freshTimer = null;

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify({state:state,hist:hist})); }catch(e){} }
  function apply(next){ pushHist(hist,state); state = next; render(); save(); }
  function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  function render(){
    POOLS.forEach(function(p){ $('n-'+p).textContent = state[p]; });
    $('total').textContent = state.red+state.blue+state.white+state.birgi;
    $('n-storm').textContent = state.storm;
    $('c-tot').textContent = state.inst+state.sorc;
    $('n-dmg').textContent = state.ralDmg;
    $('n-life').textContent = state.life;

    var f = $('flip'), lf = state.lastFlip;
    if(!lf){ f.className=''; f.textContent='No flips yet'; }
    else {
      var win = lf.result==='win';
      f.className = win?'win':'lose';
      f.innerHTML = (win ? 'WIN: flip Ral?' : 'LOSE: Ral pings you (1)') + (lf.manual?'<small>manual flip</small>':'');
      if(lf.id !== lastShownFlipId){
        lastShownFlipId = lf.id;
        f.classList.add('fresh');
        clearTimeout(freshTimer);
        freshTimer = setTimeout(function(){ f.classList.remove('fresh'); }, 1600);
      }
    }
    $('winBtns').className = state.pendingWin ? 'show' : '';

    Array.prototype.forEach.call(document.querySelectorAll('#ralSeg button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-ral')===state.ral);
    });
    $('tBirgi').classList.toggle('on', state.birgiOut);
    $('tBirgi').textContent = 'Birgi out: ' + (state.birgiOut?'ON':'off');
    $('tTurn').classList.toggle('on', state.myTurn);
    $('tTurn').textContent = 'My turn: ' + (state.myTurn?'ON':'off');
    $('note').textContent = (!state.myTurn && state.ral==='mage') ? 'Not your turn: Ral will not flip (storm still counts)'
      : (state.ral!=='mage' ? 'Ral is not Monsoon Mage: no flips' : '');
    $('bUndo').textContent = 'Undo' + (hist.length ? ' ('+hist.length+')' : '');

    var ul = $('log'); ul.innerHTML='';
    state.log.forEach(function(t){ var li=document.createElement('li'); li.textContent=t; ul.appendChild(li); });
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var d;
    if((d=b.getAttribute('data-pool'))){ apply(adjustPool(state,d,+b.getAttribute('data-d'))); return; }
    if((d=b.getAttribute('data-storm'))){ apply(adjustStorm(state,+d)); return; }
    if((d=b.getAttribute('data-life'))){ d=+d; apply(adjustLife(state,d, b.getAttribute('data-manual')||b.classList.contains('pm') ? '' : (d===-1?'Fetch':'Shock'))); return; }
    if((d=b.getAttribute('data-cast'))){ buzz(25); apply(cast(state,d,coinWin)); if(state.lastFlip && state.lastFlip.result==='lose' && state.log[0].indexOf('LOSE')>-1) buzz([60,40,60]); return; }
    if((d=b.getAttribute('data-ral'))){ apply(setRal(state,d)); return; }
  });
  $('bManual').onclick = function(){ buzz(15); apply(manualFlip(state,coinWin)); };
  $('bTransform').onclick = function(){ apply(transformRal(state)); };
  $('bKeep').onclick = function(){ apply(keepRal(state)); };
  $('tBirgi').onclick = function(){ apply(toggle(state,'birgiOut')); };
  $('tTurn').onclick = function(){ apply(toggle(state,'myTurn')); };
  $('bPhase').onclick = function(){ apply(nextPhase(state)); };
  $('bEnd').onclick = function(){ apply(endTurn(state)); };
  $('bNew').onclick = function(){ if(confirm('Start a new game? This resets everything.')) apply(newGame()); };
  $('bUndo').onclick = function(){
    var prev = undo(hist);
    if(prev){ state = prev; if(typeof state.life!=='number') state.life = 20; lastShownFlipId = state.lastFlip ? state.lastFlip.id : null; render(); save(); }
  };

  render();
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body>
</html>
